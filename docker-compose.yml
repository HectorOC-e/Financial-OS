services:
  postgres:
    image: postgres:16
    container_name: financial-os-postgres
    environment:
      POSTGRES_USER: financial_os
      POSTGRES_PASSWORD: financial_os
      POSTGRES_DB: financial_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: financial-os-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
