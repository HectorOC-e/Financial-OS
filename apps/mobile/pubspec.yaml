name: financial_os_mobile
description: FinancialOS mobile client (Flutter) — presentation only, no business logic.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  graphql_flutter: ^5.2.0
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  # freezed 3.x / graphql_codegen 2.x: required on Dart 3.12 (the old analyzer→macros→_macros
  # chain pulled by freezed 2.x and graphql_codegen 0.x no longer resolves — _macros was removed
  # from the SDK).
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  # GraphQL client codegen against packages/contracts/schema.graphql (T031).
  graphql_codegen: ^2.0.0

flutter:
  uses-material-design: true
