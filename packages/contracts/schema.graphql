# GraphQL Contract — Shared Financial Profiles
# Source of truth for resolvers (code-first export) and Flutter codegen.
# Schema version: 1.0.0. Money fields are integer minor units (cents). Percentages are basis points.

scalar DateTime
scalar UUID
scalar BigInt   # 64-bit signed integer for money minor units (cents) — avoids 32-bit Int overflow (analysis I1)

# ---------- Enums ----------
enum ProfileType { PERSONAL SHARED }
enum MemberRole { OWNER ADMIN CONTRIBUTOR VIEWER }
enum MembershipStatus { INVITED ACTIVE LEFT }
enum AccountType { WALLET ACCOUNT INVESTMENT EMERGENCY_FUND CREDIT_CARD DEBT }
enum SharedDebtKind { DEBT CREDIT_CARD }
enum PeriodLength { WEEKLY MONTHLY QUARTERLY }
enum PeriodStatus { OPEN CLOSED }
enum StandingState { ON_TRACK AHEAD BEHIND }
enum MembershipStatusEnum { INVITED ACTIVE DECLINED EXPIRED LEFT }
enum ProfileStatus { ACTIVE ARCHIVED }

# ---------- Core types ----------
type User { id: UUID!, displayName: String!, personalProfile: PersonalProfile! }

type PersonalProfile { id: UUID!, accounts: [Account!]! }

type SharedProfile {
  id: UUID!
  name: String!
  baseCurrency: String!
  periodLength: PeriodLength!
  status: ProfileStatus!           # ARCHIVED profiles are read-only (FR-007c)
  owner: Membership!
  # Unbounded lists are cursor-paginated (T107/CHK017): `first` clamped to [1,100] (default 50),
  # `after` is the opaque cursor of the last item of the previous page.
  members(first: Int, after: String): [Membership!]!          # scoped by caller permission
  accounts: [Account!]!
  currentPlan: ContributionPlan!
  currentPeriod: ContributionPeriod
  contributionRecords(first: Int, after: String, periodId: UUID): [ContributionRecord!]!   # newest first
  sharedGoals(first: Int, after: String): [SharedGoal!]!
  sharedDebts: [SharedDebt!]!
  sharedInvestments: [SharedInvestment!]!
  sharedBudgets: [SharedBudget!]!
  poolTotal(periodId: UUID): Money!  # emergent sum; derived, cached
}

type Membership {
  id: UUID!
  user: User!
  role: MemberRole!
  status: MembershipStatusEnum!
  invitationExpiresAt: DateTime       # set while status = INVITED (FR-002a)
  declaredIncome: Money               # current self-declared per-period income (FR-011)
  allocationPercentageBp: Int         # current plan allocation
  standing(periodId: UUID): ContributionStanding
  version: Int!                       # optimistic concurrency (FR-006a)
}

type Account {
  id: UUID!
  profileType: ProfileType!
  type: AccountType!
  name: String!
  balance: Money!
  currency: String!
}

type Money { amountCents: BigInt!, currency: String! }

# ---------- Contribution domain ----------
type ContributionPlan { id: UUID!, version: Int!, effectiveFromPeriodId: UUID, allocations: [ContributionAllocation!]! }
type ContributionAllocation { id: UUID!, membership: Membership!, percentageBp: Int! }
type ContributionPeriod { id: UUID!, startDate: DateTime!, endDate: DateTime!, status: PeriodStatus! }
type ContributionRecord { id: UUID!, membership: Membership!, amount: Money!, recordedAt: DateTime! }
type ContributionStanding { expected: Money!, actual: Money!, variance: Money!, state: StandingState! }

# ---------- Shared elements ----------
type SharedGoal { id: UUID!, name: String!, targetAmount: Money!, fundedAmount: Money!, version: Int! }
type SharedDebt {
  id: UUID!, kind: SharedDebtKind!, name: String!, outstandingBalance: Money!
  responsibilities: [DebtResponsibility!]!, version: Int!
}
type DebtResponsibility { id: UUID!, membership: Membership!, percentageBp: Int! }
type SharedInvestment { id: UUID!, name: String!, currentValue: Money!, valueAsOf: DateTime!, version: Int! }
type SharedBudget { id: UUID!, category: String!, limit: Money!, spent: Money!, remaining: Money!, periodId: UUID!, version: Int! }   # scoped to a period; resets per period (analysis I2)

# ---------- AI coaching (READ-ONLY) ----------
type CoachingInsight { summary: String!, suggestions: [CoachingSuggestion!]! }
# A suggestion is advisory only; applying it requires a normal validated mutation by a permitted human.
type CoachingSuggestion { title: String!, detail: String!, suggestedMutation: String }

# ---------- Queries ----------
type Query {
  me: User!
  sharedProfile(id: UUID!): SharedProfile          # permission-scoped
  myMemberships: [Membership!]!
  remainingAllocationPercentageBp: Int!            # member's available % across all profiles (FR-015a)
  coachingInsights(sharedProfileId: UUID!): CoachingInsight!   # read-only; never mutates state
}

# ---------- Mutation inputs ----------
input CreateSharedProfileInput { name: String!, baseCurrency: String!, periodLength: PeriodLength = MONTHLY }
input InviteMemberInput { sharedProfileId: UUID!, userId: UUID!, role: MemberRole! }
input SetAllocationInput { sharedProfileId: UUID!, membershipId: UUID!, percentageBp: Int! }
input RecordContributionInput { sharedProfileId: UUID!, membershipId: UUID!, amountCents: BigInt!, sourceAccountId: UUID }
input FundGoalInput { sharedGoalId: UUID!, amountCents: BigInt!, expectedVersion: Int! }
input PaySharedDebtInput { sharedDebtId: UUID!, amountCents: BigInt!, expectedVersion: Int! }   # rejects overpayment (FR-020b)
input SetDebtResponsibilityInput { sharedDebtId: UUID!, membershipId: UUID!, percentageBp: Int!, expectedVersion: Int! }
input NominateOwnerInput { sharedProfileId: UUID!, nomineeMembershipId: UUID! }   # nominee must be ACTIVE
input SetDeclaredIncomeInput { sharedProfileId: UUID!, membershipId: UUID!, amountCents: BigInt! }  # FR-011
input CreatePersonalAccountInput { type: AccountType!, name: String!, currency: String!, openingBalanceCents: BigInt! }  # personal, isolated (FR-010a)
input ContributeFromAccountInput { accountId: UUID!, sharedProfileId: UUID!, membershipId: UUID!, amountCents: BigInt! }  # only the amount enters the pool (FR-010)

# Mutations on mutable shared records accept `expectedVersion`; a stale value returns a CONFLICT error (FR-006a).

# ---------- Mutations (all server-side validated; money recomputed authoritatively) ----------
type Mutation {
  createSharedProfile(input: CreateSharedProfileInput!): SharedProfile!
  inviteMember(input: InviteMemberInput!): Membership!
  acceptInvitation(membershipId: UUID!): Membership!
  declineInvitation(membershipId: UUID!): Membership!       # FR-002a (unanswered auto-expires after 14d)
  changeMemberRole(membershipId: UUID!, role: MemberRole!, expectedVersion: Int!): Membership!
  leaveProfile(membershipId: UUID!): Membership!            # owner must transfer first (FR-007a)
  nominateOwner(input: NominateOwnerInput!): Membership!    # owner nominates an ACTIVE member (FR-007b)
  acceptOwnership(sharedProfileId: UUID!): SharedProfile!   # nominee accepts; transfer completes (FR-007b)
  archiveProfile(sharedProfileId: UUID!): SharedProfile!    # sole owner soft-closes; read-only (FR-007c)
  setDeclaredIncome(input: SetDeclaredIncomeInput!): Membership!   # FR-011 (forward-only effect, FR-016a)

  setAllocation(input: SetAllocationInput!): ContributionPlan!   # rejects if cross-profile > 100% (FR-015a)
  redistribute(sharedProfileId: UUID!, allocations: [SetAllocationInput!]!): ContributionPlan!
  recordContribution(input: RecordContributionInput!): ContributionRecord!

  createSharedGoal(sharedProfileId: UUID!, name: String!, targetAmountCents: BigInt!): SharedGoal!
  fundGoal(input: FundGoalInput!): SharedGoal!
  createSharedDebt(sharedProfileId: UUID!, kind: SharedDebtKind!, name: String!, outstandingBalanceCents: BigInt!): SharedDebt!
  paySharedDebt(input: PaySharedDebtInput!): SharedDebt!        # rejects overpayment (CHK029 default)
  setDebtResponsibility(input: SetDebtResponsibilityInput!): SharedDebt!  # set must sum to 100%
  createSharedInvestment(sharedProfileId: UUID!, name: String!, currentValueCents: BigInt!): SharedInvestment!
  updateInvestmentValue(investmentId: UUID!, newValueCents: BigInt!, expectedVersion: Int!): SharedInvestment!
  createSharedBudget(sharedProfileId: UUID!, category: String!, limitCents: BigInt!): SharedBudget!   # scoped to current period (I2)
  recordBudgetSpend(budgetId: UUID!, amountCents: BigInt!, expectedVersion: Int!): SharedBudget!

  # Personal accounts (US6) — isolated from shared profiles (FR-010/FR-010a)
  createPersonalAccount(input: CreatePersonalAccountInput!): Account!
  contributeFromAccount(input: ContributeFromAccountInput!): Account!   # debits only the contributed amount
}

# ---------- Subscriptions (live standings / pool) ----------
type Subscription {
  contributionStandingChanged(sharedProfileId: UUID!): ContributionStanding!
  poolTotalChanged(sharedProfileId: UUID!): Money!
}
